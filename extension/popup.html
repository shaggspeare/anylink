<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AnyLink</title>
  <style>
    /* The web app's tokens (src/app/globals.css). */
    :root {
      --canvas: #eceef0; --ink: #17181b; --ink-rgb: 23 24 27; --surface: #fff; --on-ink: #f4f5f6;
      --signal: #ff5a1f; --lime: #d6f24b; --on-accent: #17181b;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root { --canvas: #0f1012; --ink: #eceef0; --ink-rgb: 236 238 240; --surface: #24252a; --on-ink: #17181b; }
    }
    [hidden] { display: none !important; }
    body { margin: 0; width: 320px; padding: 18px; font: 14px/1.4 system-ui, sans-serif; background: var(--canvas); color: var(--ink); }
    section, form { display: flex; flex-direction: column; gap: 10px; }
    h1 { margin: 4px 0; font-size: 20px; }
    p { margin: 0; }
    button, input, select, .button {
      box-sizing: border-box; width: 100%; height: 42px; border-radius: 999px; font: inherit;
      border: 1px solid rgb(var(--ink-rgb) / .14); background: var(--surface); color: var(--ink); padding: 0 16px;
    }
    button, .button { display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; cursor: pointer; text-decoration: none; }
    button:disabled, select:disabled { opacity: .5; cursor: default; }
    select { border-radius: 12px; }
    svg { width: 18px; height: 18px; }
    .dark { background: var(--ink); color: var(--on-ink); border-color: transparent; }
    .accent { background: var(--signal); color: var(--on-accent); border-color: transparent; }
    .saved { background: var(--lime); color: var(--on-accent); border-color: transparent; }
    .muted, label, footer { color: rgb(var(--ink-rgb) / .6); font-size: 12px; }
    .or { display: flex; align-items: center; gap: 10px; color: rgb(var(--ink-rgb) / .45); font-size: 12px; }
    .or::before, .or::after { content: ""; flex: 1; height: 1px; background: rgb(var(--ink-rgb) / .1); }
    .links, footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    a { color: inherit; }
    .tab { padding: 12px 14px; border-radius: 16px; background: var(--surface); }
    #title { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #url { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    footer button { width: auto; height: auto; padding: 0; border: 0; background: none; color: inherit; font-weight: 400; text-decoration: underline; }
    #error { margin-top: 10px; color: var(--signal); font-size: 12px; }
    #error:empty { display: none; }
  </style>
</head>
<body>
  <p id="loading" class="muted">Loading…</p>

  <section id="signed-out" hidden>
    <img src="icons/48.png" alt="" width="36" height="36">
    <h1>Sign in to AnyLink</h1>
    <button id="apple" type="button" class="dark">
      <svg aria-hidden="true" viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-24.1 71.5 26.1 2 49.9-11.4 68-33.9z"/></svg>
      Continue with Apple
    </button>
    <button id="google" type="button">
      <svg aria-hidden="true" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <p class="or">or</p>
    <form id="password-form">
      <input id="email-input" type="email" required autocomplete="email" placeholder="you@example.com" aria-label="Email">
      <input id="password" type="password" required autocomplete="current-password" placeholder="Password" aria-label="Password">
      <button type="submit">Sign in</button>
    </form>
    <p class="links muted">
      <a href="https://www.anylink.space/login" target="_blank">New here? Create an account</a>
      <a href="https://www.anylink.space/login" target="_blank">Forgot password?</a>
    </p>
  </section>

  <section id="signed-in" hidden>
    <div id="tab" class="tab">
      <p id="title"></p>
      <p id="url" class="muted"></p>
    </div>
    <label for="collection">Collection</label>
    <select id="collection"></select>
    <button id="save" type="button" class="accent">Save to library</button>
    <a id="saved" class="button saved" target="_blank" hidden>Saved. Open it in AnyLink</a>
    <footer><span id="email"></span><button id="sign-out" type="button">Sign out</button></footer>
  </section>

  <p id="error" role="alert"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
